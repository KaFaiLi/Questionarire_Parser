# KYD audit — default red-flag answer rules
# =========================================================================
# Each rule flags an *answered* sub-question whose answer looks like a
# regulatory exception an auditor must review. Matching is by TEXT, never by
# question_id (ids are not trusted across questionnaires).
#
# Rule fields:
#   id               short stable code, surfaced in the findings register.
#   description      what the rule catches (shown to the reviewer).
#   severity         high | medium | low | info  (drives triage / sort order).
#   question_pattern OPTIONAL regex; if given, the rule only applies to
#                    questions whose canonical OR raw wording matches it.
#                    Omit to apply the answer test to every question.
#   answer_pattern   regex tested against the merged "selection | answer"
#                    string. A match raises the flag.
#
# All patterns are case-insensitive (compiled with re.IGNORECASE). This file
# is a STARTING POINT — tune the wording/severity to your KYD form and pass a
# tuned copy with `--rules my_rules.yaml`.

- id: RF-AML
  description: No AML / KYC programme in place
  severity: high
  question_pattern: '\b(aml|anti[- ]?money|money\s+laundering|kyc|know\s+your\s+customer|cdd|customer\s+due\s+diligence)\b'
  answer_pattern: '^\s*(no|none|n/?a|nil|not\s+in\s+place|we\s+do\s+not|no\s+(policy|programme|program))\b'

- id: RF-SANCTIONS
  description: Sanctions / PEP exposure identified
  severity: high
  question_pattern: '\b(sanction|sanctioned|ofac|embargo|politically\s+exposed|\bpep\b)\b'
  answer_pattern: '\b(yes|exposed|exposure|present|identified|some)\b'

- id: RF-LICENCE
  description: Regulatory licence / authorisation missing, expired or pending
  severity: high
  question_pattern: '\b(licen[cs]e|licens|authoris|authoriz|regulat(?:ed|or|ory)|registration|registered\s+with)\b'
  answer_pattern: '\b(no|none|not\s+(licen|authoris|registered)|without|expired|revoked|suspended|pending|lapsed|in\s+progress)\b'

- id: RF-ADVERSE-MEDIA
  description: Adverse media / litigation / enforcement action disclosed
  severity: high
  question_pattern: '\b(adverse\s+media|litigation|investigation|enforcement|regulatory\s+action|disciplinary|sanctioned\s+by|breach|fine[ds]?)\b'
  answer_pattern: '\b(yes|ongoing|pending|present|disclosed|several|multiple)\b'

- id: RF-BENEFICIAL-OWNER
  description: Beneficial / ultimate ownership not disclosed
  severity: high
  question_pattern: '\b(beneficial\s+owner|ultimate\s+owner|ownership\s+structure|\bubo\b)\b'
  answer_pattern: '\b(no|undisclosed|not\s+disclosed|unable|unwilling|decline|declined|unknown|withheld)\b'

- id: RF-CONTROL-NO
  description: Negative attestation on a policy / control / compliance question
  severity: medium
  question_pattern: '\b(policy|procedure|control|compliance|programme|program|framework|attest|confirm|do\s+you|does\s+your)\b'
  answer_pattern: '^\s*no\b'

- id: RF-AUDITED-FINANCIALS
  description: Financial statements not audited / unavailable
  severity: medium
  question_pattern: '\b(audited|financial\s+statement|annual\s+report|accounts|financials)\b'
  answer_pattern: '\b(no|none|not\s+audited|un-?audited|n/?a|unavailable)\b'
